# =============================================================================
# dnsmasq.conf — DNS + DHCP сервер для сети AU-TEAM
# Размещается на HQ-SRV (192.168.100.2)
# =============================================================================

# --- Основные параметры ---
domain-needed
bogus-priv
no-resolv
domain=au-team.irpo
server=77.88.8.8
listen-address=127.0.0.1,192.168.100.2
interface=*
expand-hosts
localise-queries

# --- DHCP pool для VLAN 100 (192.168.100.0/28) ---
# Серверы и сетевое оборудование HQ
dhcp-range=192.168.100.8,192.168.100.14,255.255.255.240,12h
dhcp-option=3,192.168.100.1
dhcp-option=6,192.168.100.2

# --- DHCP pool для VLAN 200 (192.168.200.0/28) ---
# Пользователи HQ
dhcp-range=192.168.200.2,192.168.200.14,255.255.255.240,12h
dhcp-option=3,192.168.200.1
dhcp-option=6,192.168.100.2

# --- Статические DNS-записи ---
address=/hq-rtr.au-team.irpo/192.168.100.1
address=/hq-srv.au-team.irpo/192.168.100.2
address=/br-rtr.au-team.irpo/192.168.0.1
address=/br-srv.au-team.irpo/192.168.0.2
address=/hq-cli.au-team.irpo/192.168.200.2

# ---cname-записи для веб-сервисов ---
cname=moodle.au-team.irpo,hq-rtr.au-team.irpo
cname=wiki.au-team.irpo,hq-rtr.au-team.irpo

# --- Reverse DNS (PTR) ---
ptr-record=1.100.168.192.in-addr.arpa,hq-rtr.au-team.irpo
ptr-record=2.100.168.192.in-addr.arpa,hq-srv.au-team.irpo
ptr-record=1.0.168.192.in-addr.arpa,br-rtr.au-team.irpo
ptr-record=2.0.168.192.in-addr.arpa,br-srv.au-team.irpo
ptr-record=2.200.168.192.in-addr.arpa,hq-cli.au-team.irpo

# --- Каталог дополнительных конфигов ---
conf-dir=/etc/dnsmasq.d
